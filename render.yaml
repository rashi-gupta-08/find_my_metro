# Changes are planned before application. No secrets or local data are uploaded.
services:
  - type: web
    name: findmymetro-api
    runtime: docker
    plan: free
    region: singapore
    branch: codex/local-backend-integration
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.app.render_entrypoint free
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: findmymetro-secrets
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: findmymetro-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: NETWORK_FILE
        value: /app/data/operator-network.json
      - key: HARDWARE_ENABLED
        value: "false"
      - key: MQTT_ENABLED
        value: "false"
      - key: SIMULATION_ENABLED
        value: "false"
      - key: PORT
        value: "8000"
databases:
  - name: findmymetro-postgres
    databaseName: metro
    user: metro_owner
    plan: free
    region: singapore
    ipAllowList: []
envVarGroups:
  - name: findmymetro-secrets
    envVars:
      - key: RENDER_AUTH_SEED
        generateValue: true
      - key: RENDER_APP_PASSWORD
        generateValue: true
