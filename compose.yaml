name: findmymetro
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  logging: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes: [./.local/provider:/app/provider:ro]
  environment: &backend-env
    APP_ENV: local
    DATABASE_URL: postgresql+psycopg://metro:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/metro
    AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
    SIMULATION_ENABLED: "false"
    SECURE_COOKIES: "false"
    CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ALLOWED_HOSTS: localhost,127.0.0.1,api
    NETWORK_FILE: ${CONTAINER_NETWORK_FILE:-/app/data/operator-network.json}
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: metro
      POSTGRES_USER: metro_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      OWNER_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data, ./hardware/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U metro_admin -d metro"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: "no"
    command: [python, -m, backend.app.bootstrap]
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://metro_owner:${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}@postgres:5432/metro
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports: [127.0.0.1:8000:8000]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
  worker:
    <<: *backend
    command: [python, -m, backend.app.worker]
    healthcheck:
      test: [CMD, python, -m, backend.app.manage, worker-health]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: [127.0.0.1:5173:8080]
    depends_on: [api]
volumes:
  postgres-data:
